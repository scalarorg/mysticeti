[package]
name = "evm-consensus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
# futures = { workspace = true }
tracing = { workspace = true }
consensus-core = { workspace = true }
consensus-config = { workspace = true }
# consensus-types = { workspace = true }

tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

clap = { version = "4.3.3", features = ["derive"] }
# eyre = "0.6.8"
# color-eyre = "0.6.2"
rand = "0.8.5"
mysten-metrics = { workspace = true }
prometheus = { workspace = true }
# sui-protocol-config = { workspace = true }

# Dependencies for validator node (from execute crate)
execute = { path = "../execute" }

# Dependencies for EVM integration
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"
hex = "0.4"
# reqwest = { version = "0.12", features = ["json"] }
fastcrypto = { workspace = true }

# Fastevm
rpc-shared-api = { git = "https://github.com/scalarorg/rpc-shared-api.git", branch = "main", package = "rpc-shared-api" }
reth-rpc-layer = { git = "https://github.com/Galxe/gravity-reth.git", branch = "main", package = "reth-rpc-layer" }

jsonrpsee = "0.26.0"
jsonrpsee-core = "0.26"
jsonrpsee-http-client = "0.26"
# jsonrpsee-server = "0.26"

tower = "0.5"

async-trait = "0.1"

# gRPC dependencies
# tonic.workspace = true
# prost.workspace = true

# Additional dependencies for enhanced integration
# parking_lot = "0.12"
# tap = "1.0"

[dev-dependencies]
# Test dependencies
tokio-test = "0.4"
assert2 = "0.3"
test-log = "0.2"
tempfile = "3.8"

